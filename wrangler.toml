name = "devin-2api-worker"
main = "src/index.ts"
compatibility_date = "2026-10-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret config — override per environment as needed.
[vars]
DEVIN_BASE_URL = "https://server.codeium.com"
DEVIN_MODEL = ""
DEBUG = "false"
# Request body cap (bytes) for /v1/* completions. Default 32 MiB.
# Lower it on Workers Free — large image bodies burn the 10 ms CPU budget.
MAX_BODY_BYTES = "33554432"

# Secrets (set with `wrangler secret put <NAME>`):
#   DEVIN_TOKEN        — devin-session-token$... (required for /v1/*)
#   API_KEY            — protects /v1/* (optional; empty = open)
#   DASHBOARD_PASSWORD — protects /panel (optional; empty = open)
